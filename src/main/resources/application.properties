quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.http.auth.proactive=false
%prod.mp.jwt.verify.issuer=${NOTIFICATIONS_JWT_ISSUER}
%prod.mp.jwt.verify.publickey.location=${NOTIFICATIONS_JWT_PUBLIC_KEY_LOCATION}
notifications.forge.base-url=${NOTIFICATIONS_FORGE_BASE_URL:http://localhost:8081}
notifications.forge.internal-token=${NOTIFICATIONS_FORGE_INTERNAL_TOKEN:}
notifications.nats.url=${NATS_URL: }
notifications.nats.token=${NATS_TOKEN: }
