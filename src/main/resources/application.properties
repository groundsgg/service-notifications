quarkus.application.name=service-notifications
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.http.auth.proactive=false
%prod.mp.jwt.verify.issuer=${NOTIFICATIONS_JWT_ISSUER}
%prod.mp.jwt.verify.publickey.location=${NOTIFICATIONS_JWT_PUBLIC_KEY_LOCATION}
notifications.forge.base-url=${NOTIFICATIONS_FORGE_BASE_URL:http://localhost:8081}
notifications.forge.internal-token=${NOTIFICATIONS_FORGE_INTERNAL_TOKEN:}
notifications.forge.connect-timeout=${NOTIFICATIONS_FORGE_CONNECT_TIMEOUT:PT2S}
notifications.forge.read-timeout=${NOTIFICATIONS_FORGE_READ_TIMEOUT:PT3S}
notifications.moderation-projector.enabled=${NOTIFICATIONS_MODERATION_PROJECTOR_ENABLED:false}
notifications.nats.url=${NATS_URL: }
notifications.nats.token=${NATS_TOKEN: }
notifications.nats.token-file=${NATS_TOKEN_FILE:${GROUNDS_TOKEN_FILE: }}
notifications.nats.authentication-mode=${NOTIFICATIONS_NATS_AUTHENTICATION_MODE:url-credentials}
notifications.nats.connect-timeout=${NOTIFICATIONS_NATS_CONNECT_TIMEOUT:PT2S}
notifications.nats.reconnect-wait=${NOTIFICATIONS_NATS_RECONNECT_WAIT:PT2S}
notifications.nats.max-reconnects=${NOTIFICATIONS_NATS_MAX_RECONNECTS:60}
notifications.nats.allow-unauthenticated=${NOTIFICATIONS_NATS_ALLOW_UNAUTHENTICATED:false}
notifications.moderation-projector.stream=${NOTIFICATIONS_MODERATION_STREAM:MODERATION}
notifications.moderation-projector.consumer=${NOTIFICATIONS_MODERATION_CONSUMER:service-notifications-moderation-ready-v1}
