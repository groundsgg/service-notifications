name: Release

on:
  push:
    tags:
      - "service-notifications-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      commit: ${{ steps.meta.outputs.commit }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            ref="service-notifications-v${version}"
          else
            ref="${GITHUB_REF_NAME}"
            version="${ref#service-notifications-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
      - id: meta
        run: |
          echo "version=${{ steps.ref.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ steps.ref.outputs.ref }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

  image:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/groundsgg/service-notifications
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_AT=${{ needs.metadata.outputs.timestamp }}
